build: script
shallow_clone: true
skip_tags: true

environment:
  TZ: Asia/Shanghai
  GO15VENDOREXPERIMENT: 1
  GO111MODULE: on

  matrix:
  - go: '1.26.11'
  - go: '1.25.14'
  - go: '1.24.13'
  - go: '1.23.12'
  - go: '1.22.12'
  - go: '1.21.13'
  - go: '1.20.14'
  - go: '1.19.13'

init:
- gvm install go$go --binary
- gvm use go$go

install:
- pwd
- uname -a
- go version
- gcc --version

build_script:
- go mod tidy || true
- go build -v -ldflags="-s -w"

after_build:
- "bash -c 'appveyor addMessage $(du -k emu-log)'"

test_script:
- go vet ./...
- go test -v -cover ./...

image:
- Ubuntu

matrix:
  exclude:
  - image: MacOS
    go: '1.10.8'
  - image: Visual Studio 2019
    go: '1.10.8'
  - image: Visual Studio 2019
    go: '1.26.11'

for:
- matrix:
    only:
    - image: MacOS
  before_build:
  - sw_vers
  before_test:
  - sudo systemsetup -settimezone $TZ

- matrix:
    only:
    - image: MacOS
      go: '1.14.15'
  test_script:
  - go vet ./...
  - go test -covermode=count -coverprofile=coverage.txt ./...
  on_success:
  - curl -fsSL https://keybase.io/codecovsecops/pgp_keys.asc | gpg --import --no-default-keyring --keyring trustedkeys.gpg
  - curl -fsSL --remote-name-all https://uploader.codecov.io/latest/macos/codecov{,.SHA256SUM{,.sig}}
  - gpgv codecov.SHA256SUM.sig codecov.SHA256SUM
  - shasum -a 256 -c codecov.SHA256SUM
  - chmod +x codecov
  - ./codecov

- matrix:
    only:
    - image: Ubuntu
      go: '1.10.8'
  clone_folder: '$HOME/.gvm/pkgsets/go$go/global/src/github.com/arnie97/emu-log'
  before_build:
  - gvm install go1.14.15 --binary
  - (gvm use go1.14.15 && go mod vendor)

- matrix:
    only:
    - image: Ubuntu
  before_build:
  - lsb_release -a

- matrix:
    only:
    - image: Visual Studio 2019
  init:
  - ps: |
      $env:GOROOT = 'c:\go' + ($env:go -replace '\.\d+$|\.')
      $env:PATH = "$env:GOROOT\bin;c:\msys64\mingw64\bin;c:\msys64\bin;$env:PATH"
  before_build:
  - ver
  before_test:
  - tzutil /s "China Standard Time"
